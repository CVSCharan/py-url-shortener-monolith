<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python URL Shortener</title>
    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900 font-sans">
    
    <!-- Dynamic Island Navbar -->
    <div class="fixed top-4 left-1/2 -translate-x-1/2 w-[95%] max-w-4xl z-50 transition-all duration-300">
        <nav class="bg-white/70 backdrop-blur-md shadow-lg border border-white/40 rounded-full px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2 rounded-full text-white shadow-sm flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                </div>
                <span class="font-bold text-lg text-gray-900 tracking-tight hidden sm:block">Shortener</span>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="#" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Home</a>
                <a href="https://github.com/CVSCharan" target="_blank" class="px-4 py-2 rounded-full bg-gray-900 text-white text-sm font-medium hover:bg-gray-800 transition-colors shadow-sm">GitHub</a>
            </div>
        </nav>
    </div>

    <!-- Main Content (Added pt-28 to offset the fixed dynamic island) -->
    <main class="flex-grow max-w-5xl mx-auto px-4 pt-32 pb-12 sm:px-6 lg:px-8 w-full flex flex-col justify-center">
        
        <!-- Hero Section -->
        <div class="text-center mb-10 sm:mb-16 mt-4 sm:mt-10">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-6 drop-shadow-sm">
                Shorten your links.
            </h1>
            <p class="text-base sm:text-lg text-gray-500 max-w-2xl mx-auto px-4">
                Built with FastAPI, PostgreSQL, Jinja2, and HTMX. Lightning fast and completely Server-Side Rendered.
            </p>
        </div>

        <!-- Shortener Card -->
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100/50 overflow-hidden mb-12 transform transition-all hover:shadow-2xl hover:-translate-y-1 duration-300">
            <div class="p-6 sm:p-10">
                <form hx-post="/shorten" hx-target="#url-table-container" hx-swap="innerHTML" class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-indigo-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        </div>
                        <input type="url" name="target_url" placeholder="https://your-extremely-long-url.com/article/123" required
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border-2 border-gray-100 bg-gray-50 text-gray-900 focus:outline-none focus:ring-0 focus:border-indigo-500 focus:bg-white transition-all duration-200 text-base sm:text-lg">
                    </div>
                    <button type="submit" 
                        class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-lg font-bold rounded-2xl text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 shadow-md hover:shadow-indigo-500/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200">
                        Shorten
                        <svg class="ml-2 -mr-1 h-5 w-5 htmx-indicator animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <!-- Links Section -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6 px-2">
                <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Your Links</h2>
                <div class="h-1 flex-1 bg-gradient-to-r from-gray-100 to-transparent ml-4 rounded-full"></div>
            </div>
            
            <div id="url-table-container" class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden">
                <!-- We use an include so we can reuse just the table HTML in our HTMX response -->
                {% include 'partials/url_list.html' %}
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white/50 backdrop-blur-sm border-t border-gray-100 mt-auto py-8">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-sm text-gray-500 flex items-center gap-1 font-medium">
                    Crafted with 
                    <svg class="w-4 h-4 text-red-500 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg> 
                    by 
                    <a href="https://charan-cvs.dev" target="_blank" class="text-indigo-600 hover:text-indigo-800 transition-colors font-bold underline decoration-indigo-200 underline-offset-4">
                        CVS Charan
                    </a>
                </div>
                <div class="text-xs text-gray-400 font-medium uppercase tracking-wider">
                    Python Monolith Architecture
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
