<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Professional Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-gray-900 antialiased">
    
    <!-- Standard Professional Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <svg class="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    <span class="font-semibold text-lg tracking-tight">URL Shortener</span>
                </div>
                <nav class="flex gap-4">
                    <a href="https://github.com/CVSCharan" target="_blank" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">GitHub</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-12 w-full flex flex-col">
        
        <!-- Header Section -->
        <div class="mb-10 text-center sm:text-left">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Create Short Links</h1>
            <p class="text-base text-gray-600">
                A fast, reliable URL shortening service powered by FastAPI and PostgreSQL.
            </p>
        </div>

        <!-- Input Card -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-10">
            <div class="p-6">
                <form hx-post="/shorten" hx-target="#url-table-container" hx-swap="innerHTML" class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-1 relative">
                        <label for="target_url" class="sr-only">Long URL</label>
                        <input type="url" id="target_url" name="target_url" placeholder="Enter your long URL here (e.g., https://example.com/very-long-path)" required
                            class="block w-full pl-4 pr-4 py-3 rounded-md border border-gray-300 bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-colors">
                    </div>
                    <button type="submit" 
                        class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">
                        Shorten URL
                        <svg class="ml-2 -mr-1 h-4 w-4 htmx-indicator animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <!-- Links Table Section -->
        <div>
            <div class="mb-4">
                <h2 class="text-xl font-semibold text-gray-900">Recent Links</h2>
            </div>
            
            <div id="url-table-container" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                {% include 'partials/url_list.html' %}
            </div>
        </div>
    </main>

    <!-- Professional Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <p class="text-sm text-gray-500">
                    &copy; 2026 CVS Charan. All rights reserved.
                </p>
                <div class="text-sm text-gray-500">
                    Designed by <a href="https://charan-cvs.dev" target="_blank" class="text-primary-600 hover:text-primary-700 font-medium hover:underline">CVS Charan</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
