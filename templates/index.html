<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python URL Shortener</title>
    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen selection:bg-indigo-100 selection:text-indigo-900">
    <div class="max-w-4xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-4">
                URL Shortener 🔗
            </h1>
            <p class="text-lg text-gray-500 max-w-2xl mx-auto">
                Built with FastAPI, PostgreSQL, Jinja2, and HTMX. Lightning fast and completely Server-Side Rendered.
            </p>
        </div>

        <!-- Shortener Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden mb-12 transform transition-all hover:shadow-2xl duration-300">
            <div class="p-8">
                <form hx-post="/shorten" hx-target="#url-table-container" hx-swap="innerHTML" class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 relative">
                        <input type="url" name="target_url" placeholder="https://your-extremely-long-url.com/article/123" required
                            class="w-full pl-4 pr-12 py-4 rounded-xl border border-gray-200 bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-transparent transition-all duration-200">
                    </div>
                    <button type="submit" 
                        class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-base font-medium rounded-xl text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200">
                        Shorten
                        <svg class="ml-2 -mr-1 h-5 w-5 htmx-indicator animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

        <!-- Links Section -->
        <div>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Your Links</h2>
            </div>
            
            <div id="url-table-container" class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
                <!-- We use an include so we can reuse just the table HTML in our HTMX response -->
                {% include 'partials/url_list.html' %}
            </div>
        </div>
    </div>
</body>
</html>
