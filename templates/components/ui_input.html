{% macro input(type="text", name="", id="", placeholder="", value="", class="", required=False, autofocus=False) %}
<input type="{{ type }}" {% if name %}name="{{ name }}"{% endif %} {% if id %}id="{{ id }}"{% endif %} placeholder="{{ placeholder }}" {% if value %}value="{{ value }}"{% endif %} {% if required %}required{% endif %} {% if autofocus %}autofocus{% endif %}
    class="flex h-10 md:h-12 w-full rounded-md border border-dark-border bg-dark-bg px-3 py-2 text-sm text-white ring-offset-dark-bg file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 transition-colors {{ class }}">
{% endmacro %}
