{% macro collapsible(summary_text, class="") %}
<details class="group mt-2 border border-dark-border rounded-md bg-dark-card overflow-hidden transition-all duration-300 {{ class }}">
    <summary class="text-sm font-medium text-dark-heading cursor-pointer hover:bg-dark-border/50 transition-colors outline-none list-none flex items-center gap-2 px-4 py-3 select-none">
        <svg class="w-4 h-4 text-gray-500 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        {{ summary_text }}
    </summary>
    <div class="p-4 border-t border-dark-border bg-dark-bg/50">
        {{ caller() }}
    </div>
</details>
{% endmacro %}
