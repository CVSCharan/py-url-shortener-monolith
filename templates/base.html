<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <!-- Include HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
            },
            colors: {
              dark: {
                bg: "#09090b",
                card: "#09090b",
                border: "#27272a",
                text: "#a1a1aa",
                heading: "#fafafa",
              },
              accent: {
                DEFAULT: "#fafafa",
                hover: "#f4f4f5",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      /* Subtle dot background for dark mode */
      .bg-dots {
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
      }

      .htmx-indicator {
        display: none;
      }
      .htmx-request .htmx-indicator {
        display: inline-block;
      }
      tr.htmx-indicator {
        display: none;
      }
      tr.htmx-request.htmx-indicator {
        display: table-row;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body
    class="bg-dark-bg text-dark-text min-h-screen flex flex-col antialiased bg-dots"
  >
    {% block navbar %}
    <!-- Navbar -->
    <header
      class="bg-dark-bg/80 backdrop-blur-md border-b border-dark-border sticky top-0 z-50"
    >
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14 md:h-16 items-center">
          <div class="flex items-center gap-3">
            <div
              class="w-7 h-7 md:w-8 md:h-8 rounded bg-dark-card border border-dark-border flex items-center justify-center shadow-[0_0_10px_rgba(56,189,248,0.2)]"
            >
              <svg
                class="w-3.5 h-3.5 md:w-4 md:h-4 text-accent"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                ></path>
              </svg>
            </div>
            <a
              href="/"
              class="font-bold text-base md:text-lg tracking-tight text-dark-heading hover:text-accent transition-colors"
              >URL Shortener</a
            >
          </div>
          <nav class="flex gap-4">
            <!-- Highlighting current page using simple JS on load, or we can just keep them neutral -->
            <a
              href="/"
              class="text-xs md:text-sm font-semibold text-dark-text hover:text-white transition-colors"
              id="nav-home"
              >Home</a
            >
            <a
              href="/dashboard"
              class="text-xs md:text-sm font-semibold text-dark-text hover:text-white transition-colors"
              id="nav-dashboard"
              >Dashboard</a
            >
            <a
              href="/about"
              class="text-xs md:text-sm font-semibold text-dark-text hover:text-white transition-colors"
              id="nav-about"
              >About</a
            >
            <a
              href="https://github.com/CVSCharan"
              target="_blank"
              class="text-xs md:text-sm font-semibold text-dark-text hover:text-white transition-colors hidden sm:block"
              >GitHub</a
            >
          </nav>
        </div>
      </div>
    </header>

    <script>
      // Simple script to highlight the active navigation link based on current path
      document.addEventListener("DOMContentLoaded", () => {
        const path = window.location.pathname;
        if (path === "/")
          document.getElementById("nav-home")?.classList.add("text-accent");
        if (path.startsWith("/dashboard"))
          document
            .getElementById("nav-dashboard")
            ?.classList.add("text-accent");
        if (path.startsWith("/about"))
          document.getElementById("nav-about")?.classList.add("text-accent");
      });
    </script>
    {% endblock %}

    <!-- Main Content -->
    <main class="flex-grow w-full flex flex-col items-center">
      {% block content %}{% endblock %}
    </main>

    {% block footer %}
    <!-- Professional Footer -->
    <footer class="bg-dark-card border-t border-dark-border mt-auto">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8 w-full">
        <div
          class="flex flex-col md:flex-row justify-between items-center gap-3 md:gap-4 w-full"
        >
          <p class="text-xs md:text-sm text-gray-500 font-medium">
            &copy; 2026 CVS Charan. All rights reserved.
          </p>
          <div class="text-xs md:text-sm text-gray-500 flex items-center gap-2">
            Designed by
            <a
              href="https://charan-cvs.dev"
              target="_blank"
              class="text-dark-text hover:text-white font-bold transition-colors"
              >CVS Charan</a
            >
          </div>
        </div>
      </div>
    </footer>
    {% endblock %}

    <!-- Modal Container -->
    <div id="modal-container"></div>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
