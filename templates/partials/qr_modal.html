<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <!-- Modal Content -->
    <div class="bg-dark-card border border-dark-border rounded-xl shadow-2xl p-6 w-[90%] max-w-sm relative flex flex-col items-center text-center">
        <button onclick="document.getElementById('modal-container').innerHTML = ''" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors focus:outline-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        
        <h3 class="text-xl font-bold text-dark-heading mb-1">QR Code</h3>
        <p class="text-sm text-gray-400 mb-6 truncate max-w-[250px]">{{ request.base_url }}{{ url.custom_alias if url.custom_alias else url.short_code }}</p>
        
        <div class="bg-white p-3 rounded-xl mb-6 shadow-lg inline-block">
            <img src="/qr/{{ url.short_code }}" alt="QR Code" class="w-48 h-48 block mx-auto">
        </div>
        
        <button onclick="document.getElementById('modal-container').innerHTML = ''" class="w-full py-2.5 bg-accent text-dark-bg font-semibold rounded-lg hover:bg-gray-200 transition-colors focus:outline-none">
            Close
        </button>
    </div>
</div>
