<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Short URL
                </th>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Original URL
                </th>
                <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-32">
                    Clicks
                </th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
            {% for url in urls %}
            <tr class="hover:bg-indigo-50/50 transition-colors duration-150">
                <td class="px-6 py-4 whitespace-nowrap">
                    <a href="{{ request.base_url }}{{ url.short_code }}" target="_blank" 
                       class="inline-flex items-center text-sm font-medium text-indigo-600 hover:text-indigo-900 group">
                        {{ request.base_url }}{{ url.short_code }}
                        <svg class="ml-1 w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-500 max-w-md truncate" title="{{ url.target_url }}">
                        {{ url.target_url }}
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-center">
                    <span class="inline-flex items-center justify-center px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
                        {{ url.clicks }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-6 py-12 text-center text-gray-500 text-sm italic">
                    <div class="flex flex-col items-center justify-center">
                        <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        No URLs shortened yet. Create one above!
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
