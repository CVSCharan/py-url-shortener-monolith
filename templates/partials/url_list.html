<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200/50">
        <thead class="bg-white/40">
            <tr>
                <th scope="col" class="px-8 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">
                    Shortened URL
                </th>
                <th scope="col" class="px-8 py-5 text-left text-xs font-bold text-slate-500 uppercase tracking-widest">
                    Destination
                </th>
                <th scope="col" class="px-8 py-5 text-center text-xs font-bold text-slate-500 uppercase tracking-widest w-32">
                    Visits
                </th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-100/50">
            {% for url in urls %}
            <tr class="hover:bg-white/60 transition-colors duration-200 group">
                <td class="px-8 py-6 whitespace-nowrap">
                    <a href="{{ request.base_url }}{{ url.short_code }}" target="_blank" 
                       class="inline-flex items-center text-base font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
                        {{ request.base_url }}{{ url.short_code }}
                        <svg class="ml-2 w-4 h-4 opacity-0 group-hover:opacity-100 group-hover:-translate-y-0.5 group-hover:translate-x-0.5 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </td>
                <td class="px-8 py-6">
                    <div class="text-sm font-medium text-slate-500 max-w-md truncate" title="{{ url.target_url }}">
                        {{ url.target_url }}
                    </div>
                </td>
                <td class="px-8 py-6 whitespace-nowrap text-center">
                    <span class="inline-flex items-center justify-center px-4 py-1.5 rounded-full text-sm font-bold bg-gradient-to-r from-indigo-50 to-purple-50 text-indigo-700 border border-indigo-100/50 shadow-sm">
                        {{ url.clicks }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-8 py-20 text-center">
                    <div class="flex flex-col items-center justify-center">
                        <div class="w-16 h-16 rounded-full bg-indigo-50/50 flex items-center justify-center mb-4">
                            <svg class="w-8 h-8 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-700 mb-1">No links yet</h3>
                        <p class="text-slate-500 text-sm">Paste a long URL in the box above to get started.</p>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
