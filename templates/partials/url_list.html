<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Short URL
                </th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Original URL
                </th>
                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-32">
                    Clicks
                </th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            {% for url in urls %}
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 whitespace-nowrap">
                    <a href="{{ request.base_url }}{{ url.short_code }}" target="_blank" 
                       class="text-sm font-medium text-primary-600 hover:text-primary-800 hover:underline flex items-center gap-1 group">
                        {{ request.base_url }}{{ url.short_code }}
                        <svg class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-600 max-w-md truncate" title="{{ url.target_url }}">
                        {{ url.target_url }}
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm text-gray-500 font-medium">
                    {{ url.clicks }}
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-6 py-10 text-center">
                    <p class="text-sm text-gray-500">No URLs have been shortened yet.</p>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
