<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-dark-border">
        <thead class="bg-dark-bg">
            <tr>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Short URL
                </th>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Original URL
                </th>
                <th scope="col" class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider w-32">
                    Clicks
                </th>
            </tr>
        </thead>
        <tbody class="divide-y divide-dark-border bg-dark-card relative">
            <!-- Skeleton Loader Row (Shown during HTMX requests) -->
            <tr id="table-skeleton" class="htmx-indicator animate-pulse bg-dark-card/50 transition-all duration-200">
                <td class="px-3 md:px-6 py-3 md:py-4 whitespace-nowrap">
                    <div class="flex items-center space-x-2">
                        <div class="h-4 bg-dark-border rounded w-32"></div>
                        <div class="h-5 bg-dark-border rounded w-10"></div>
                        <div class="h-5 bg-dark-border rounded w-8"></div>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="h-4 bg-dark-border rounded w-48"></div>
                </td>
                <td class="px-6 py-5 whitespace-nowrap text-right">
                    <div class="h-6 bg-dark-border rounded w-6 ml-auto"></div>
                </td>
            </tr>

            {% for url in urls %}
            <tr class="hover:bg-dark-border/30 transition-colors group">
                <td class="px-3 md:px-6 py-3 md:py-4 whitespace-nowrap">
                    <div class="flex items-center space-x-2">
                        <a href="/{{ url.custom_alias if url.custom_alias else url.short_code }}" target="_blank" class="text-accent hover:text-white font-semibold flex items-center transition-colors text-sm md:text-base">
                            {{ url.custom_alias if url.custom_alias else url.short_code }}
                            {% if url.hashed_password %}
                            <svg class="w-3 h-3 md:w-4 md:h-4 ml-1 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" title="Password Protected"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            {% endif %}
                        </a>
                        <button onclick="navigator.clipboard.writeText('{{ request.base_url }}{{ url.custom_alias if url.custom_alias else url.short_code }}'); const btn = this; const originalText = btn.innerHTML; btn.innerHTML = 'Copied!'; setTimeout(() => btn.innerHTML = originalText, 2000);" class="text-[10px] md:text-xs bg-dark-card border border-dark-border px-2 py-1 rounded hover:bg-dark-border transition-colors">Copy</button>
                        <button hx-get="/qr_modal/{{ url.short_code }}" hx-target="#modal-container" hx-swap="innerHTML" class="text-[10px] md:text-xs bg-dark-card border border-accent/30 text-accent hover:bg-accent hover:text-dark-bg px-2 py-1 rounded transition-colors ml-1 font-bold focus:outline-none flex items-center gap-1" title="View QR Code">
                            <span>QR</span>
                            <svg class="htmx-indicator w-2.5 h-2.5 md:w-3 md:h-3 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        </button>
                    </div>
                </td>
                <td class="px-6 py-5">
                    <div class="text-sm text-gray-400 max-w-md truncate" title="{{ url.target_url }}">
                        {{ url.target_url }}
                    </div>
                </td>
                <td class="px-6 py-5 whitespace-nowrap text-right">
                    <span class="inline-flex items-center justify-center px-2.5 py-1 rounded bg-dark-bg border border-dark-border text-xs font-medium text-gray-300">
                        {{ url.clicks }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-6 py-16 text-center">
                    <p class="text-sm text-gray-500">No URLs have been shortened yet.</p>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
