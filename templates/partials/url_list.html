<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-dark-border">
        <thead class="bg-dark-bg">
            <tr>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Short URL
                </th>
                <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                    Original URL
                </th>
                <th scope="col" class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider w-32">
                    Clicks
                </th>
            </tr>
        </thead>
        <tbody class="divide-y divide-dark-border bg-dark-card">
            {% for url in urls %}
            <tr class="hover:bg-dark-border/30 transition-colors group">
                <td class="px-6 py-5 whitespace-nowrap">
                    <a href="{{ request.base_url }}{{ url.short_code }}" target="_blank" 
                       class="text-sm font-medium text-accent hover:text-white flex items-center gap-2 transition-colors">
                        {{ request.base_url }}{{ url.short_code }}
                        <svg class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </td>
                <td class="px-6 py-5">
                    <div class="text-sm text-gray-400 max-w-md truncate" title="{{ url.target_url }}">
                        {{ url.target_url }}
                    </div>
                </td>
                <td class="px-6 py-5 whitespace-nowrap text-right">
                    <span class="inline-flex items-center justify-center px-2.5 py-1 rounded bg-dark-bg border border-dark-border text-xs font-medium text-gray-300">
                        {{ url.clicks }}
                    </span>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="px-6 py-16 text-center">
                    <p class="text-sm text-gray-500">No URLs have been shortened yet.</p>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
